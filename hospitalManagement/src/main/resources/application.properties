spring.application.name=hospitalManagement
#DB configuration
#here hospitalDB is our DB name
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospitalDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
#This will create schema on running your application for the first time
spring.jpa.hibernate.ddl-auto=update
#TO see all the SQL statements run by hibernate
spring.jpa.show-sql=true
#Format the hibernate queries, statements
spring.jpa.properties.hibernate.format_sql=true
# Show the values bound to the query parameters
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Always run data.sql
spring.sql.init.mode=always
# Defer data.sql execution until after Hibernate has created the schema
spring.jpa.defer-datasource-initialization=true
