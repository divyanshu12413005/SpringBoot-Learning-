services:

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile

    image: learn-spring-security-jwt:latest
    container_name: springboot-app

    depends_on:
      - mongodb
      - redis

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker